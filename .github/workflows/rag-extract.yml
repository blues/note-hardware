name: RAG extract

# Regenerate _Tools/extract_for_rag/rag-extracted/ HTML + sitemap.xml from Tier-1 hardware files,
# publish it to GitHub Pages (ragpi's sitemap connector crawls the published sitemap), and open a
# PR (one rolling PR on $PR_BRANCH) to land the refreshed output on master, which is protected
# against direct pushes. Runs on every merge to master (incremental by default); merging that PR
# doesn't retrigger it (paths-ignore on the output dir). A clean full rebuild is opt-in via
# workflow_dispatch.

on:
  push:
    branches: [master]
    paths-ignore:
      - '_Tools/extract_for_rag/rag-extracted/**'
  # From master this publishes like a push does. From any other branch it's a dry run: the output
  # is only uploaded as the github-pages artifact, with no PR and no deploy.
  workflow_dispatch:
    inputs:
      full:
        description: 'Full clean rebuild (wipe + re-extract everything, incl. all schematics)'
        type: boolean
        default: false

env:
  PR_BRANCH: bot/rag-refresh
  SOURCE_MARKER: _Tools/extract_for_rag/rag-extracted/.source-sha   # commit the output was last updated from

# Per ref: master runs (which share $PR_BRANCH and the Pages deploy) still queue one at a time, but
# a dry run dispatched from another branch can't displace a pending master run.
concurrency:
  group: rag-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # longest run so far 11 min; a --full rebuild is est. 25-30 min
    permissions:
      contents: write        # push the refreshed output to $PR_BRANCH
      pull-requests: write   # open the PR that lands it on master
      actions: read          # find the last successful run (rollback guard)
    steps:
      - uses: actions/checkout@v7   # Node 24 runtime
        with:
          fetch-depth: 0   # full history for change detection

      - uses: actions/setup-python@v7   # Node 24 runtime
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: pip install -r _Tools/extract_for_rag/requirements.txt

      # Start from the output still waiting in the open PR, if any, so it accumulates rather than
      # being dropped when this run force-pushes $PR_BRANCH, and so the diff below starts from the
      # commit that output was generated from. Files the PR deleted come back from master here, but
      # they're orphans and get pruned again.
      - name: Fold in the open RAG PR, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list --head "$PR_BRANCH" --base master --state open --json number --jq '.[].number')" ]; then
            git fetch origin "$PR_BRANCH"
            git checkout FETCH_HEAD -- _Tools/extract_for_rag/rag-extracted
            echo "Folded in output from the open $PR_BRANCH PR."
          fi

      # Diff from the commit recorded in the output itself ($SOURCE_MARKER), so every source change
      # the output doesn't reflect yet is caught, including ones from a run that failed, was
      # cancelled, or was reverted after its output reached the PR.
      - name: Compute changed source files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
        run: |
          base="$(cat "$SOURCE_MARKER" 2>/dev/null || true)"

          # A re-run keeps its original commit, so re-running an old run (full or not) would publish
          # output older than what's already live or waiting in the PR. Refuse rather than roll back.
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            published="$(gh run list --workflow rag-extract.yml --branch master --status success --limit 1 \
                           --json headSha --jq '.[0].headSha // empty')"
            on_master="$(git show "origin/master:$SOURCE_MARKER" 2>/dev/null || true)"
            for newer in "$base" "$published" "$on_master"; do
              if [ -n "$newer" ] && [ "$newer" != "$GITHUB_SHA" ] && \
                 git merge-base --is-ancestor "$GITHUB_SHA" "$newer" 2>/dev/null; then
                echo "::error::$GITHUB_SHA is older than $newer, whose output is already published or waiting in the RAG PR. Publishing it would roll that back; dispatch the workflow from master instead."
                exit 1
              fi
            done
          fi

          # Incremental is the default. Only an explicit workflow_dispatch with full=true rebuilds.
          if [ "$FULL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
            # Three dots: only this commit's side, so a dry run from a branch that lacks commits behind
            # the marker doesn't re-extract them from its older sources.
            git diff --name-only "$base...$GITHUB_SHA" > changed.txt
            echo "Changed files since $base:"; cat changed.txt
          elif [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "::error::Can't tell which commit the existing output was generated from ($SOURCE_MARKER is missing or names a commit that isn't in history), so changed sources could be missed. Dispatch this workflow from master with full=true to rebuild everything and record a new baseline."
            exit 1
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
            : > changed.txt
            echo "::warning::No diff base ($SOURCE_MARKER is missing or not in history), so this dry run only generates missing output and prunes orphans."
          fi

      - name: Run extraction
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAG_VLM_MODEL: ${{ vars.RAG_VLM_MODEL }}             # optional; tool defaults to gpt-5.5
          RAG_BASE_URL: ${{ vars.RAG_BASE_URL }}               # optional; defaults to the Pages URL
          RAG_SOURCE_BASE_URL: ${{ vars.RAG_SOURCE_BASE_URL }} # optional; defaults to GitHub blob
        run: |
          cd _Tools/extract_for_rag
          if [ "${{ steps.changed.outputs.mode }}" = "full" ]; then
            python extract.py --full
          else
            python extract.py --changed-from "$GITHUB_WORKSPACE/changed.txt"
          fi
          echo "$GITHUB_SHA" > "$GITHUB_WORKSPACE/$SOURCE_MARKER"

      # One commit on top of the current master, force-pushed so the PR always holds everything
      # not yet merged. Pages is published from this workspace below, so the PR only brings
      # master in line with what's already live. Only from master: a branch checkout would put
      # that branch's unmerged commits into a PR targeting master.
      - name: Open, update, or close the RAG PR
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A _Tools/extract_for_rag/rag-extracted   # -A stages deletions too
          pr="$(gh pr list --head "$PR_BRANCH" --base master --state open --json number --jq '.[].number')"
          # The marker moves on every run, so on its own it's only worth a PR when master lacks one.
          ignore=()
          if git cat-file -e "HEAD:$SOURCE_MARKER" 2>/dev/null; then
            ignore=(":(exclude)$SOURCE_MARKER")
          fi
          if git diff --staged --quiet -- . "${ignore[@]}"; then
            echo "No changes to rag-extracted/."
            # The open PR's output was folded in above, so no diff means extraction put every file
            # it touched back to master's version (e.g. its source change was reverted). Close it
            # rather than leave obsolete HTML waiting to be merged.
            if [ -n "$pr" ]; then
              gh pr close "$pr" --comment "Closed by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}): master's rag-extracted/ output is current again, so these changes are obsolete."
              git push origin --delete "$PR_BRANCH"
            fi
            exit 0
          fi
          git switch -c "$PR_BRANCH"
          git commit -m "chore(rag): refresh rag-extracted HTML"
          git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          if [ -z "$pr" ]; then
            gh pr create --base master --head "$PR_BRANCH" \
              --title "chore(rag): refresh rag-extracted HTML" \
              --body "Generated by the [RAG extract workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The output is already published to GitHub Pages; merging this brings master in line with it. Later runs update this PR rather than opening another one, and merging it doesn't rerun the workflow."
          else
            echo "Updated the open $PR_BRANCH PR (#$pr)."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5   # bundles upload-artifact@v7 (Node 24)
        with:
          path: _Tools/extract_for_rag/rag-extracted

  deploy:
    needs: extract        # skipped if extraction failed -> never publishes broken/garbage output
    if: github.ref == 'refs/heads/master'   # the github-pages environment only accepts master
    runs-on: ubuntu-latest
    timeout-minutes: 15   # deploy-pages gives up on its own after 10 min
    permissions:
      pages: write           # publish to GitHub Pages
      id-token: write        # required by deploy-pages
      actions: read          # find the last successful run (rollback guard)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # "Re-run failed jobs" after a failed deploy reruns only this job, skipping extract's guard,
      # and deploys this run's original artifact. Refuse if a later run has already published.
      - name: Check no later run has published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rag-extract.yml --branch master \
                      --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$latest" ] && [ "$latest" -gt "$GITHUB_RUN_ID" ]; then
            echo "::error::Run $latest started after this one and has already published newer output. Deploying this run's artifact would roll that back; dispatch the workflow from master instead."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5   # Node 24
