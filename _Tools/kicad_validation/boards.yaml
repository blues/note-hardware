# Per-board configuration for the KiCad port validation harness.
#
# All paths are relative to the repository root. A board entry is added/filled
# in as its port is executed; run_all.py skips gates whose config is absent
# and reports them as SKIPPED (skipped gates must be justified in the board's
# Porting-Notes.md — see the NO-GO policy in README.md).
#
# Sections per board:
#   kicad:    project paths (root sheet, pcb)
#   bom:      shipped-BOM parsing rules (see bom_compare.py)
#   gerbers:  layer map KiCad-export <-> shipped fab package (see gerber_diff.py)
#   odb:      extracted ODB++ root, when the product ships one (netlist gate)

boards:

  mojo:
    product_dir: Mojo/v1.1
    kicad:
      sch: Mojo/v1.1/KiCad_format/Mojo.kicad_sch
      pcb: Mojo/v1.1/KiCad_format/Mojo.kicad_pcb
    bom:
      path: Mojo/v1.1/Assembly Normal/BOM/BOM-Mojo-v4-Normal.xls
      sheet: BOM Simple
      header_contains: Designator
      kicad_mpn_field: MANUFACTURER PART NUMBER
      columns:
        refs: Designator
        value: Name
        mpn: Manufacturer Part Number 1
      skip_refdes: '^(TP|FID|MH|LOGO)\d*$'
    gerbers:
      original_dir: Mojo/v1.1/Fabrication/Gerber
      original_tool: Altium
      outline:
        kicad: "*Edge_Cuts.gm1"
        original: "*.GM"
      layers:
        F_Cu:         { kicad: "*.gtl", original: "*.GTL" }
        B_Cu:         { kicad: "*.gbl", original: "*.GBL" }
        F_Paste:      { kicad: "*.gtp", original: "*.GTP" }
        B_Paste:      { kicad: "*.gbp", original: "*.GBP" }
        F_Mask:       { kicad: "*.gts", original: "*.GTS" }
        B_Mask:       { kicad: "*.gbs", original: "*.GBS" }
        F_Silkscreen: { kicad: "*.gto", original: "*.GTO" }
        B_Silkscreen: { kicad: "*.gbo", original: "*.GBO" }

  # --- filled in as each port is executed (see plan order) -------------------

  cygnet:
    product_dir: Cygnet/v1.2
    kicad:
      sch: Cygnet/v1.2/KiCad_format/Cygnet.kicad_sch
      pcb: Cygnet/v1.2/KiCad_format/Cygnet.kicad_pcb
    bom:
      path: Cygnet/v1.2/Cygnet v1.2 BOM.xlsx
      header_contains: Designator
      kicad_mpn_field: MPN
      columns:
        refs: Designator
        value: Name
        mpn: Manufacturer Part Number 1
      refdes_map:
        BOOT: SW1
        RST: SW2
        USER: SW3
      skip_refdes: '^(TP|FID|MH|LOGO|CST)\d*$'
    gerbers:
      original_dir: /private/tmp/claude-501/-Users-roblauer-Documents-GitHub-blues-note-hardware/26345e84-f61c-4c64-85bd-58e534b0269f/scratchpad/cygnet-gerbers
      original_tool: Altium
      outline:
        kicad: "*Edge_Cuts.gm1"
        original: "*.GM"
      layers:
        F_Cu:         { kicad: "*.gtl", original: "*.GTL" }
        In1_Cu:       { kicad: "*L2.g1", original: "*.G1" }
        In2_Cu:       { kicad: "*L3.g2", original: "*.G2" }
        B_Cu:         { kicad: "*.gbl", original: "*.GBL" }
        F_Paste:      { kicad: "*.gtp", original: "*.GTP" }
        B_Paste:      { kicad: "*.gbp", original: "*.GBP" }
        F_Mask:       { kicad: "*.gts", original: "*.GTS" }
        B_Mask:       { kicad: "*.gbs", original: "*.GBS" }
        F_Silkscreen: { kicad: "*.gto", original: "*.GTO" }
        B_Silkscreen: { kicad: "*.gbo", original: "*.GBO" }

  scoop:
    product_dir: Scoop/v1.0
    kicad:
      sch: Scoop/v1.0/KiCad_format/Scoop.kicad_sch
      pcb: Scoop/v1.0/KiCad_format/Scoop.kicad_pcb
    bom:
      path: Scoop/v1.0/992-00084-A_BOM.xlsx
      header_contains: Ref Des
      kicad_mpn_field: MANUFACTURER PART NUMBER
      check_value: false
      columns:
        refs: Ref Des
        value: Name
        mpn: MPN
      skip_refdes: '^(TP|FID|FD|MH|LOGO)\d*$'
    gerbers:
      original_dir: /private/tmp/claude-501/-Users-roblauer-Documents-GitHub-blues-note-hardware/26345e84-f61c-4c64-85bd-58e534b0269f/scratchpad/scoop-gerbers
      original_tool: Altium
      outline:
        kicad: "*Edge_Cuts.gm1"
        original: "*.GM1"
      layers:
        F_Cu:         { kicad: "*.gtl", original: "*.GTL" }
        B_Cu:         { kicad: "*.gbl", original: "*.GBL" }
        F_Paste:      { kicad: "*.gtp", original: "*.GTP" }
        B_Paste:      { kicad: "*.gbp", original: "*.GBP" }
        F_Mask:       { kicad: "*.gts", original: "*.GTS" }
        B_Mask:       { kicad: "*.gbs", original: "*.GBS" }
        F_Silkscreen: { kicad: "*.gto", original: "*.GTO" }
        B_Silkscreen: { kicad: "*.gbo", original: "*.GBO" }

  notecarrier-cx:
    product_dir: Notecarrier-CX/v1.7
    odb:
      # tarball at Notecarrier-CX/v1.7/FAB/ODB/ ships pre-extracted at odb/
      root: Notecarrier-CX/v1.7/FAB/ODB/odb
      step: pcb

  notecarrier-xi:
    product_dir: Notecarrier-XI/v1.4

  notecarrier-xs:
    product_dir: Notecarrier-XS/v1.2

  notecarrier-x:
    product_dir: Notecarrier-X/v1.2

  notecarrier-xm:
    product_dir: Notecarrier-XM/v1.2

  notecarrier-xp:
    product_dir: Notecarrier-XP/v3.1
